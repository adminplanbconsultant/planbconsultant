<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan B hero review</title><style>body{margin:0;padding:24px;background:#f4f2eb;color:#1c472a;font:16px/1.6 Arial}h1{font:36px Georgia;margin:0 0 16px}nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}button,a{color:inherit}button{padding:10px 18px;border:1px solid #1c472a;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#1c472a;color:#f4f2eb}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}img{width:100%;height:auto;display:block}figcaption{margin:8px 0 16px;font-weight:bold}.mobile img{max-width:390px;margin:auto}.mobile #before{max-height:900px;object-fit:cover;object-position:top}.mobile figcaption{text-align:center}@media(max-width:700px){.comparison{grid-template-columns:1fr}}</style><h1>Homepage hero — before / after</h1><p>Desktop screenshots show the complete hero. Mobile comparisons show the original 900px viewport; the complete updated mobile hero is linked below.</p><nav><button data-locale="en" aria-pressed="true">English</button><button data-locale="ar" aria-pressed="false">Arabic</button><button data-width="1440" aria-pressed="true">Desktop</button><button data-width="390" aria-pressed="false">Mobile</button></nav><div class="comparison"><figure><figcaption>Before</figcaption><img id="before" alt="Original homepage hero"></figure><figure><figcaption>After</figcaption><img id="after" alt="Updated homepage hero"></figure></div><p><a id="full" href="after-en-1440.png">Open complete updated hero screenshot</a> · <a href="../../HERO-IMAGE-SOURCES.md">Photography credits and licenses</a> · <a href="../../HERO-IMPLEMENTATION-REPORT.md">Implementation and validation report</a></p><script>let locale='en',width='1440';function update(){for(const phase of ['before','after'])document.getElementById(phase).src=width==='390'?'comparison-'+locale+'-390.png':phase+'-'+locale+'-'+width+'.png';if(width==='390'){document.getElementById('before').src='before-'+locale+'-390.png';document.getElementById('after').src='after-'+locale+'-390.png'}document.querySelector('.comparison').classList.toggle('mobile',width==='390');document.getElementById('full').href='after-'+locale+'-'+width+'.png';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.locale?b.dataset.locale===locale:b.dataset.width===width)))}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.locale)locale=b.dataset.locale;if(b.dataset.width)width=b.dataset.width;update()});update()</script></html>
